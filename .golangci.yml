version: "2"
linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosec
    - errorlint
    - gocritic
    - modernize
    - revive
    - misspell
    - unconvert
    - unparam
    - nolintlint
  settings:
    gosec:
      excludes:
        - G204 # starting the go command and test binaries is the very purpose of this tool
        - G304 # the paths read and written are limited to the packages the user names and temporary directories
        - G703 # the same reason as G304; this is its path-taint analysis
        - G306
    gocritic:
      enabled-tags: [diagnostic, performance, style]
      disabled-checks: [hugeParam, rangeValCopy, unnamedResult, paramTypeCombine]
    errcheck:
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint
  exclusions:
    paths:
      - testdata
formatters:
  enable:
    - gofmt
    - goimports
